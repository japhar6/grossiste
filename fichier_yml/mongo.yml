apiVersion: v1
kind: PersistentVolume
metadata:
  name: mongodb-pv
  namespace: innov
spec:
  capacity:
    storage: 40Gi  # Taille du volume
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: /mnt/data/mongodb  # Le chemin sur le serveur hôte où le stockage sera monté
  persistentVolumeReclaimPolicy: Retain  # La politique de récupération lorsque le PVC est supprimé
  storageClassName: microk8s-hostpath  # Ajout de la StorageClass

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongodb-pvc
  namespace: innov
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 40Gi  # La quantité d'espace de stockage demandée
  volumeMode: Filesystem
  volumeName: mongodb-pv  # Le nom du PV que nous avons créé plus haut

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  namespace: innov
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
        - name: mongodb
          image: eddyrakotonirina/inoov-t:mongo_innov
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mongodb-secrets
                  key: MONGO_INITDB_ROOT_USERNAME
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongodb-secrets
                  key: MONGO_INITDB_ROOT_PASSWORD
            - name: MONGO_INITDB_DATABASE
              valueFrom:
                secretKeyRef:
                  name: mongodb-secrets
                  key: MONGO_INITDB_DATABASE
            - name: ME_CONFIG_MONGODB_ADMINUSERNAME
              valueFrom:
                secretKeyRef:
                  name: mongodb-secrets
                  key: ME_CONFIG_MONGODB_ADMINUSERNAME
            - name: ME_CONFIG_MONGODB_ADMINPASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongodb-secrets
                  key: ME_CONFIG_MONGODB_ADMINPASSWORD
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: mongodb-data
              mountPath: /data/db
      volumes:
        - name: mongodb-data
          persistentVolumeClaim:
            claimName: mongodb-pvc  # Référence au PVC
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: innov
spec:
  selector:
    app: mongodb
  ports:
    - protocol: TCP
      port: 27017
      targetPort: 27017
  clusterIP: None  # Service sans IP interne pour accéder à MongoDB depuis d'autres pods dans le cluster
